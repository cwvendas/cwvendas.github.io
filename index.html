<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWvendas - Achados da Shopee</title>
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#fff5f0;color:#222}
header{background:#ee4d2d;color:#fff;text-align:center;padding:22px 12px}
header h1{margin:0;font-size:26px}header p{margin:6px 0 0;opacity:.9}
#busca{display:block;width:calc(100% - 32px);max-width:500px;margin:14px auto;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;padding:0 12px 30px;max-width:1000px;margin:auto}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px #0001;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.info{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.nome{font-size:14px;line-height:1.3}
.preco{color:#ee4d2d;font-weight:700;font-size:17px}
.btn{margin-top:auto;background:#ee4d2d;color:#fff;text-align:center;padding:9px;border-radius:8px;font-weight:600}
.card{position:relative}.card.hoje{grid-column:1/-1}.novo{position:absolute;top:8px;left:8px;background:#ee4d2d;color:#fff;font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px}.tg{display:block;max-width:500px;margin:12px auto 0;width:calc(100% - 32px);box-sizing:border-box;text-align:center;background:#229ed9;color:#fff;padding:11px;border-radius:10px;font-weight:600;text-decoration:none}footer{text-align:center;font-size:12px;color:#777;padding:0 12px 24px}
</style></head><body>
<header><h1>CWvendas</h1><p>Achados da Shopee com o melhor pre&ccedil;o</p></header>
<a class="tg" href="https://t.me/cwachados" target="_blank">Receba as ofertas no Telegram</a>
<input id="busca" placeholder="Buscar produto...">
<div class="grid" id="grid"></div>
<footer>Links de afiliado: posso receber comiss&atilde;o sem custo extra pra voc&ecirc;. Pre&ccedil;os podem mudar na Shopee.</footer>
<script>
let P=[],H=new Date().toLocaleDateString('sv');
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function draw(q){q=(q||'').toLowerCase();document.getElementById('grid').innerHTML=P.filter(p=>p.nome.toLowerCase().includes(q)).map(p=>
`<a class="card${p.data==H&&!q?' hoje':''}" href="${esc(p.link)}" target="_blank" rel="noopener">${p.data==H?'<span class="novo">NOVO HOJE</span>':''}<img src="${esc(p.imagem)}" loading="lazy" alt=""><div class="info"><div class="nome">${esc(p.nome)}</div>${p.preco?`<div class="preco">${esc(p.preco)}</div>`:''}<div class="btn">Ver na Shopee</div></div></a>`).join('')||'<p>Nenhum produto ainda.</p>'}
fetch('produtos.json?'+Date.now()).then(r=>r.json()).then(d=>{P=d.reverse();draw()}).catch(()=>draw());
document.getElementById('busca').oninput=e=>draw(e.target.value);
</script></body></html>
